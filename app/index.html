<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baton" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Baton</title>
    <!-- JS の読み込み前から出す全画面スケルトンと入力欄（設計書 7.4・7.9）。React が引き継ぐ -->
    <style>
      html, body { margin: 0; background: #fff; }
      body { min-height: 100dvh; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #0B0D12; -webkit-tap-highlight-color: transparent; }
      #boot-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(60vmax 60vmax at 0% 0%, rgba(120,170,255,0.34), transparent 70%),
          radial-gradient(55vmax 55vmax at 100% 30%, rgba(190,150,255,0.26), transparent 70%),
          radial-gradient(55vmax 55vmax at 85% 100%, rgba(255,180,150,0.22), transparent 70%),
          radial-gradient(52vmax 52vmax at 0% 100%, rgba(130,230,200,0.22), transparent 70%),
          linear-gradient(180deg, #FFFFFF 0%, #F6F8FC 100%); }
      #boot-skeleton { position: fixed; inset: 0; z-index: 2; pointer-events: none; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 0; box-sizing: border-box; }
      .b-col { max-width: 760px; margin: 0 auto; }
      .b-bar { display: flex; justify-content: flex-end; height: 44px; margin-bottom: 4px; }
      .b-chip { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 16px; border-radius: 999px; background: rgba(255,255,255,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(15,23,42,0.06), 0 2px 8px rgba(15,23,42,0.05); }
      .b-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(11,13,18,0.12); }
      .b-ring { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2.5px rgba(11,13,18,0.08); }
      .b-av { width: 32px; height: 32px; border-radius: 50%; background: rgba(11,13,18,0.07); }
      .b-list { padding-top: 22px; }
      .b-sk { position: relative; overflow: hidden; background: rgba(11,13,18,0.05); }
      .b-sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.65) 50%, transparent 100%); transform: translateX(-100%); animation: b-shimmer 1.4s linear infinite; }
      @keyframes b-shimmer { to { transform: translateX(100%); } }
      .b-label { width: 56px; height: 12px; margin: 0 8px 12px; border-radius: 6px; }
      .b-card { height: 74px; margin-bottom: 10px; border-radius: 24px; background: rgba(255,255,255,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(15,23,42,0.06), 0 2px 8px rgba(15,23,42,0.05); }
      #root { position: relative; z-index: 1; }
      #boot-composer-wrap { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 31; padding: 0 12px; display: flex; justify-content: center; box-sizing: border-box; }
      .b-composer { width: 100%; max-width: 760px; min-height: 56px; box-sizing: border-box; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 20px; border-radius: 28px;
        background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(32px) saturate(180%); backdrop-filter: blur(32px) saturate(180%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.08), 0 24px 64px rgba(15,23,42,0.12); }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .b-composer { background: rgba(255,255,255,0.94); } }
      #boot-composer { flex: 1; min-width: 0; display: block; margin: 0; padding: 8px 0; height: 40px; border: 0; outline: none; resize: none; background: transparent; color: #0B0D12; font: inherit; font-size: 16px; line-height: 24px; overflow-y: hidden; caret-color: #0A84FF; }
      #boot-send { flex: none; width: 40px; height: 40px; border: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(11,13,18,0.12); cursor: pointer; }
      @media (prefers-reduced-motion: reduce) { .b-sk::after { animation: none; opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="boot-bg" aria-hidden="true"></div>
    <div id="boot-skeleton" data-testid="skeleton-screen" aria-busy="true">
      <div class="b-col">
        <div class="b-bar"><div class="b-chip"><span class="b-dot"></span><span class="b-ring"></span><span class="b-av"></span></div></div>
        <div class="b-list">
          <div class="b-sk b-label"></div>
          <div class="b-sk b-card"></div>
          <div class="b-sk b-card"></div>
          <div class="b-sk b-card"></div>
          <div class="b-sk b-card"></div>
          <div class="b-sk b-card"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <div id="boot-composer-wrap">
      <div class="b-composer">
        <textarea id="boot-composer" data-testid="composer-input" aria-label="COO への指示" rows="1" autocomplete="off" autofocus></textarea>
        <button id="boot-send" type="button" data-testid="composer-send" aria-label="送信">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
