name: CI

# テストだけを回す（デプロイは Mac mini から。v1 設計書 D-23）。
# 外に繋がない（DESIGN-v2 15.1・D-60）: 本物の claude は呼ばず偽 claude（tools/fake-claude）、
# 実際のプッシュサービスにも繋がない（E2E のヘルパーが立てる偽のプッシュサービス localhost:8799）。
# Cloudflare の認証情報も使わない（D1・DO はローカルの workerd）。API キーも渡さない。

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

env:
  # ランナーが起動する claude は常に偽物（本物の ~/.local/bin/claude は CI に無い）。e2e/helpers/runner.ts もこれ以外を拒む
  # （ANTHROPIC_API_KEY などは設定しない。空でも定義されていると偽 claude は「API キーが渡った」として終了コード 3 で止まる）
  BATON_CLAUDE_BIN: ${{ github.workspace }}/tools/fake-claude/bin/claude

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型検査・ユニット・Workers 統合・本番ビルドの検査
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: 型検査（shared・worker・web・runner・e2e・偽 claude）
        run: npm run typecheck

      - name: ユニット（shared・web・runner・偽 claude）
        run: npm run test:unit
      - name: Workers 統合（workerd + D1 + DO）
        run: npm run test:worker -w app

      # 本番と同じビルドに、テスト用ログイン・偽 claude・e2e の設定・秘密のファイルが混ざっていないこと（デプロイの最初と同じ検査）
      - name: 本番ビルド
        run: npm run build
      - name: 本番の成果物にテスト用のものが無い
        run: node scripts/assert-no-test-routes.mjs

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: iphone-chromium
            browser: chromium
          - project: iphone-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: 偽 claude が動く（本物の claude は使わない）
        run: |
          test -x "$BATON_CLAUDE_BIN" || chmod +x "$BATON_CLAUDE_BIN"
          "$BATON_CLAUDE_BIN" --version
          "$BATON_CLAUDE_BIN" auth status

      - name: Playwright のブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright のブラウザを入れる
        run: npx playwright install ${{ matrix.browser }}

      - name: e2e 用の秘密（ダミー値）
        run: cp app/.dev.vars.e2e.example app/.dev.vars.e2e

      # webServer（app の e2e:serve: e2e ビルド → まっさらなローカル D1 のマイグレーション → 8790 番）と
      # ランナー（globalSetup が偽 claude を渡して子プロセスで起動。作業フォルダと sample-repo は一時フォルダ）は Playwright が立ち上げる。
      # 偽のプッシュサービス（8799 番）は E59 が立てて止める
      - name: E2E
        run: npm test -w e2e -- --project=${{ matrix.project }}

      - name: ランナーのログをレポートと一緒に置く
        if: failure()
        run: |
          mkdir -p e2e/test-results
          cp e2e/.auth/runner.log e2e/test-results/runner.log 2>/dev/null || true
      - name: 失敗時のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
